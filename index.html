<!doctype html>

<title>VTM V5 — Lifepath Chargen</title>
<style>
:root{color-scheme:dark;--bg:#0d0e11;--panel:#15171c;--panel2:#1b1e24;--line:#2c3038;--line2:#444a55;--text:#f2f3f5;--muted:#9ba3af;--accent:#d8d2c6;--danger:#e4a0a0;--good:#b8d9b7;--warn:#e0c77f;--info:#a9c8df}
*{box-sizing:border-box}html{scroll-behavior:auto}html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",sans-serif}body{min-height:100vh}button,input,select,textarea{font:inherit}button{touch-action:manipulation}.app{max-width:960px;margin:auto;padding:calc(10px + env(safe-area-inset-top)) 12px calc(88px + env(safe-area-inset-bottom))}.top{position:sticky;top:0;z-index:20;margin:calc(-10px - env(safe-area-inset-top)) -12px 10px;padding:calc(10px + env(safe-area-inset-top)) 12px 9px;background:rgba(13,14,17,.96);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}.head{display:flex;gap:10px;align-items:center;justify-content:space-between}.title{font-weight:800;font-size:19px}.sub{font-size:12px;color:var(--muted);margin-top:2px}.badge{font-size:10px;border:1px solid var(--line);padding:3px 7px;border-radius:999px;color:var(--muted)}.progress{display:flex;gap:6px;overflow:auto;margin-top:9px;padding-bottom:2px;scrollbar-width:none}.progress::-webkit-scrollbar{display:none}.stepbtn{flex:0 0 auto;min-height:36px;padding:7px 10px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--muted);font-size:12px;font-weight:700}.stepbtn.active{background:var(--accent);color:#111216;border-color:var(--accent)}.section{display:none}.section.active{display:block}.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px;margin:10px 0}.card h1{font-size:24px;margin:0 0 8px}.card h2{font-size:18px;margin:0 0 10px}.card h3{font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin:17px 0 8px}.small{font-size:12px;line-height:1.45;color:var(--muted)}.notice{padding:10px;border-radius:12px;border:1px solid var(--line);font-size:12px;line-height:1.45;margin:9px 0}.notice.warn{color:var(--warn)}.notice.good{color:var(--good)}.notice.info{color:var(--info)}.notice.danger{color:var(--danger)}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.field{margin:8px 0}.field label{display:block;font-size:11px;color:var(--muted);margin-bottom:5px}.field input,.field select,.field textarea,select,input[type=text],input[type=number],textarea{width:100%;min-height:44px;border:1px solid var(--line);background:var(--panel2);color:var(--text);border-radius:11px;padding:9px 10px}.field textarea{min-height:96px;resize:vertical}.fieldhint{font-size:11px;color:var(--info);margin-top:5px}.readonly{min-height:44px;display:flex;align-items:center;border:1px solid var(--line);background:#121419;color:var(--muted);border-radius:11px;padding:9px 10px}.switchrow{display:flex;gap:10px;align-items:flex-start;padding:10px 0}.switchrow input{width:22px;height:22px;flex:0 0 auto}.btn{min-height:44px;border:1px solid var(--line);background:var(--panel2);color:var(--text);border-radius:11px;padding:8px 11px;font-weight:700}.btn.primary{background:var(--accent);border-color:var(--accent);color:#111216}.btn.danger{color:var(--danger)}.btn:disabled,.ratingbtn:disabled{opacity:.32}.footerbar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(13,14,17,.97);border-top:1px solid var(--line);backdrop-filter:blur(14px);padding:7px 10px calc(7px + env(safe-area-inset-bottom))}.footerinner{max-width:960px;margin:auto;display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px}.flash{display:none}.flash.show{display:block}.miniLabel{font-size:10px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin:10px 0 5px}.chiprow,.disciplines,.focusChips{display:flex;gap:6px;flex-wrap:wrap}.chip,.discipline{border:1px solid var(--line);background:var(--panel2);border-radius:999px;padding:6px 9px;font-size:11px;font-weight:700}.emptyLine,.emptyState{font-size:12px;color:var(--muted);padding:10px;border:1px dashed var(--line);border-radius:11px;margin:7px 0}.row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}.row:last-child{border-bottom:0}.rowname{font-size:14px;font-weight:650}.rowmeta{font-size:11px;color:var(--muted);margin-top:2px}.stepper{display:grid;grid-template-columns:38px 38px 38px;gap:4px;align-items:center}.stepper button{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);color:var(--text);font-size:20px;font-weight:800}.stepper .n{text-align:center;font-weight:800}.budget{display:flex;gap:7px;flex-wrap:wrap;margin:8px 0}.pill{border:1px solid var(--line);background:var(--panel2);padding:6px 8px;border-radius:999px;font-size:11px}.pill.good{color:var(--good)}.pill.warn{color:var(--warn)}.tag{display:flex;gap:7px;align-items:center;justify-content:space-between;border:1px solid var(--line);background:var(--panel2);border-radius:11px;padding:8px 10px;margin:5px 0}.x{border:0;background:transparent;color:var(--danger);font-size:20px;min-width:34px;min-height:34px}.resadd{display:grid;grid-template-columns:170px 1fr 75px auto;gap:7px;align-items:end}.kv{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;padding:7px 0;border-bottom:1px solid var(--line);font-size:13px}.kv:last-child{border-bottom:0}.kv small{grid-column:1/-1;color:var(--muted);font-size:11px}.issue{padding:5px 0;border-bottom:1px solid rgba(255,255,255,.08)}.issue:last-child{border-bottom:0}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;white-space:pre-wrap;font-size:11px}.summaryList{background:var(--panel2);border-radius:12px;padding:6px 10px}
/* Clan */
.clanintro{margin:6px 0 14px}.clanintro h1{margin:0 0 6px}.clangrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.clancard{display:grid;grid-template-columns:58px minmax(0,1fr);gap:11px;text-align:left;width:100%;border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:15px;padding:12px;min-height:112px}.clancard:hover,.clancard:focus-visible{border-color:#656b76}.clancard.selected{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}.clansigil{width:58px;height:58px;border-radius:15px;border:1px solid var(--line);background:var(--panel2);display:flex;align-items:center;justify-content:center;font-weight:900;letter-spacing:.06em;font-size:15px}.clanname{font-weight:800;font-size:16px}.clantag{font-size:12px;color:var(--muted);line-height:1.35;margin-top:4px}.clandisc{font-size:11px;color:var(--info);margin-top:7px}.selectedMark{font-size:10px;color:var(--good);margin-top:6px}.clanhero{display:grid;grid-template-columns:90px minmax(0,1fr);gap:15px;align-items:start}.clanhero .clansigil{width:90px;height:90px;font-size:20px;border-radius:22px}.clanhero h2{font-size:25px;margin:0 0 4px}.clanbody{font-size:14px;line-height:1.55;color:#d8dbe1}.traitgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.traitbox{background:var(--panel2);border:1px solid var(--line);border-radius:13px;padding:10px;margin:6px 0}.traitlabel{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:4px}.traitname{font-weight:800;margin-bottom:4px}.clanactions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
/* Attributes */
.quotaBar{position:sticky;top:102px;z-index:10;display:flex;gap:6px;flex-wrap:wrap;background:rgba(21,23,28,.97);padding:8px 0;margin:8px 0}.quota{border:1px solid var(--line);background:var(--panel2);border-radius:999px;padding:7px 9px;font-size:11px}.quota.done{color:var(--good);border-color:#435b48}.attrgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.attrpick{border:1px solid var(--line);background:var(--panel2);border-radius:12px;padding:9px}.attrpick.unset{border-color:#5c4e35}.attrname{font-size:13px;font-weight:750;margin-bottom:7px}.ratingbuttons{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}.ratingbtn{min-height:38px;border:1px solid var(--line);border-radius:9px;background:#121419;color:var(--text);font-weight:800}.ratingbtn.selected{background:var(--accent);color:#111216;border-color:var(--accent)}.ratingbtn.clear{color:var(--muted)}.derivedPreview{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}.derivedPreview>div{display:grid;grid-template-columns:1fr auto;gap:3px;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:10px}.derivedPreview span{font-size:11px;color:var(--muted)}.derivedPreview b{font-size:22px}.derivedPreview small{grid-column:1/-1;font-size:10px;color:var(--muted)}

.lpselect{border-bottom:1px solid var(--line);padding-bottom:12px;margin-bottom:10px}.lpselect:last-child{border-bottom:0}.lifepathDetail{background:var(--panel2);border-radius:12px;padding:10px;font-size:13px}.lifepathDetail p{color:var(--muted);line-height:1.45;margin:5px 0}
/* Focuses */
.focusBucket{border-top:1px solid var(--line);padding:5px 0 15px}.focusBucket:first-of-type{border-top:0}.bucketHead{display:flex;justify-content:space-between;align-items:center}.tips{font-size:11px;color:var(--warn);background:#191814;border:1px solid #383527;border-radius:10px;padding:8px;margin:7px 0}.focusChip{border:1px solid var(--line2);background:var(--panel2);color:var(--text);border-radius:999px;padding:8px 10px;font-size:12px}.focusChip.chosen{opacity:.45;text-decoration:line-through}.focusBonus{color:var(--good);font-size:10px}.customFocus{display:grid;grid-template-columns:1fr auto;gap:7px;margin-top:8px}.customFocus input{min-height:44px;border:1px solid var(--line);background:var(--panel2);color:var(--text);border-radius:11px;padding:9px 10px}

.disciplineCard{border-top:1px solid var(--line);padding-top:6px;margin-top:12px}.discHead h3{font-size:15px;text-transform:none;letter-spacing:0;color:var(--text);margin-bottom:4px}.dots{color:var(--accent);letter-spacing:.08em}.powerSlot{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:10px;margin:8px 0}.slotLabel{font-size:10px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin-bottom:6px}.powerSlot select{width:100%;min-height:44px;border:1px solid var(--line);background:#121419;color:var(--text);border-radius:10px;padding:8px}.manualPower{display:grid;grid-template-columns:1fr auto;gap:7px;margin-top:7px}.manualPower input{min-height:42px;border:1px solid var(--line);background:#121419;color:var(--text);border-radius:10px;padding:8px}.chosenPower{font-size:11px;color:var(--good);margin-top:7px}
/* Humanity */
.conviction{background:var(--panel2);border:1px solid var(--line);border-radius:13px;padding:10px;margin:8px 0}.convHead{display:flex;align-items:center;justify-content:space-between}
/* Review */
.reviewTitle{display:flex;gap:12px;justify-content:space-between;align-items:flex-start}.reviewTitle h2{font-size:23px}.status{font-size:10px;font-weight:800;border:1px solid var(--line);border-radius:999px;padding:6px 8px;white-space:nowrap}.status.ok{color:var(--good)}.status.bad{color:var(--danger)}.statstrip{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;margin:12px 0}.statstrip>div{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:9px;text-align:center}.statstrip span{display:block;font-size:9px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}.statstrip b{font-size:23px}.reviewgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.skillReview{columns:2;column-gap:18px}.skillReview .kv{break-inside:avoid}.reviewActions{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:16px 0}details{margin-top:12px}summary{cursor:pointer;color:var(--muted);font-size:12px;margin-bottom:8px}
@media(max-width:700px){.grid2,.clangrid,.traitgrid,.reviewgrid{grid-template-columns:1fr}.grid3,.attrgrid{grid-template-columns:1fr}.resadd{grid-template-columns:1fr 1fr}.resadd .wide{grid-column:1/-1}.title{font-size:17px}.card{padding:11px}.row{grid-template-columns:minmax(0,1fr) 118px}.quotaBar{top:100px}.attrpick{display:grid;grid-template-columns:110px 1fr;align-items:center}.attrname{margin:0}.statstrip{grid-template-columns:repeat(3,1fr)}.skillReview{columns:1}.reviewActions{grid-template-columns:1fr}.clanhero{grid-template-columns:70px minmax(0,1fr)}.clanhero .clansigil{width:70px;height:70px}.manualPower{grid-template-columns:1fr}.clanactions{grid-template-columns:1fr 1fr}}
