<title>VTM V5 — Lifepath Chargen</title>
<style>
:root{color-scheme:dark;--bg:#0d0e11;--panel:#15171c;--panel2:#1b1e24;--line:#2c3038;--text:#f2f3f5;--muted:#9ba3af;--accent:#d8d2c6;--danger:#e4a0a0;--good:#b8d9b7;--warn:#e0c77f;--info:#a9c8df}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",sans-serif}body{min-height:100vh}button,input,select,textarea{font:inherit}button{touch-action:manipulation}.app{max-width:920px;margin:auto;padding:calc(10px + env(safe-area-inset-top)) 12px calc(86px + env(safe-area-inset-bottom))}.top{position:sticky;top:0;z-index:20;margin:calc(-10px - env(safe-area-inset-top)) -12px 10px;padding:calc(10px + env(safe-area-inset-top)) 12px 9px;background:rgba(13,14,17,.95);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}.head{display:flex;gap:10px;align-items:center;justify-content:space-between}.title{font-weight:800;font-size:19px}.sub{font-size:12px;color:var(--muted);margin-top:2px}.badge{font-size:10px;border:1px solid var(--line);padding:3px 7px;border-radius:999px;color:var(--muted)}.progress{display:flex;gap:6px;overflow:auto;margin-top:9px;padding-bottom:2px}.stepbtn{flex:0 0 auto;min-height:36px;padding:7px 10px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--muted);font-size:12px;font-weight:700}.stepbtn.active{background:var(--accent);color:#111216;border-color:var(--accent)}.section{display:none}.section.active{display:block}.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:13px;margin:10px 0}.card h2{font-size:17px;margin:0 0 10px}.card h3{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:13px 0 7px}.small{font-size:12px;line-height:1.45;color:var(--muted)}.notice{padding:10px;border-radius:12px;border:1px solid var(--line);font-size:12px;line-height:1.45;margin:8px 0}.notice.warn{color:var(--warn)}.notice.good{color:var(--good)}.notice.info{color:var(--info)}.notice.danger{color:var(--danger)}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:9px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.field{margin:8px 0}.field label{display:block;font-size:11px;color:var(--muted);margin-bottom:5px}.field input,.field select,.field textarea,select,input[type=text],input[type=number],textarea{width:100%;min-height:44px;border:1px solid var(--line);background:var(--panel2);color:var(--text);border-radius:11px;padding:9px 10px}.field textarea{min-height:92px;resize:vertical}.switchrow{display:flex;gap:10px;align-items:center;padding:8px 0}.switchrow input{width:22px;height:22px}.attr{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:8px}.attr label{display:block;color:var(--muted);font-size:10px;margin-bottom:4px}.attr select{min-height:39px;padding:6px 8px}.lphead{display:flex;gap:9px;align-items:flex-start;justify-content:space-between}.lpmeta{font-size:11px;color:var(--muted);margin-top:3px}.row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}.row:last-child{border-bottom:0}.rowname{font-size:14px;font-weight:650}.rowmeta{font-size:11px;color:var(--muted);margin-top:2px}.stepper{display:grid;grid-template-columns:38px 38px 38px;gap:4px;align-items:center}.stepper button{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);color:var(--text);font-size:20px;font-weight:800}.stepper .n{text-align:center;font-weight:800}.budget{display:flex;gap:7px;flex-wrap:wrap;margin:8px 0}.pill{border:1px solid var(--line);background:var(--panel2);padding:6px 8px;border-radius:999px;font-size:11px}.pill.good{color:var(--good)}.pill.warn{color:var(--warn)}.focusbox{display:grid;grid-template-columns:160px 1fr auto;gap:7px;align-items:end;margin:8px 0}.btn{min-height:44px;border:1px solid var(--line);background:var(--panel2);color:var(--text);border-radius:11px;padding:8px 11px;font-weight:700}.btn.primary{background:var(--accent);border-color:var(--accent);color:#111216}.btn.danger{color:var(--danger)}.btn:disabled{opacity:.4}.tag{display:flex;gap:7px;align-items:center;justify-content:space-between;border:1px solid var(--line);background:var(--panel2);border-radius:11px;padding:8px 10px;margin:5px 0}.tag .x{border:0;background:transparent;color:var(--danger);font-size:18px}.resadd{display:grid;grid-template-columns:170px 1fr 70px auto;gap:7px;align-items:end}.reviewgrid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.kv{padding:7px 0;border-bottom:1px solid var(--line);font-size:13px}.kv:last-child{border-bottom:0}.issue{padding:7px 0;border-bottom:1px solid var(--line);font-size:12px}.issue:last-child{border-bottom:0}.footerbar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(13,14,17,.96);border-top:1px solid var(--line);backdrop-filter:blur(14px);padding:7px 10px calc(7px + env(safe-area-inset-bottom))}.footerinner{max-width:920px;margin:auto;display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px}.flash{display:none}.flash.show{display:block}.invalid{outline:1px solid #8c5656}.mutedBox{background:var(--panel2);border-radius:12px;padding:9px}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;white-space:pre-wrap;font-size:11px}.linklike{color:var(--info)}

.clanintro{margin:6px 0 14px}.clangrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.clancard{display:grid;grid-template-columns:58px minmax(0,1fr);gap:11px;text-align:left;width:100%;border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:15px;padding:12px;min-height:112px}.clancard:hover,.clancard:focus-visible{border-color:#656b76}.clancard.selected{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}.clansigil{width:58px;height:58px;border-radius:15px;border:1px solid var(--line);background:var(--panel2);display:flex;align-items:center;justify-content:center;font-weight:900;letter-spacing:.06em;font-size:15px}.clanname{font-weight:800;font-size:16px}.clantag{font-size:12px;color:var(--muted);line-height:1.35;margin-top:4px}.clandisc{font-size:11px;color:var(--info);margin-top:7px}.clanhero{display:grid;grid-template-columns:90px minmax(0,1fr);gap:15px;align-items:start}.clanhero .clansigil{width:90px;height:90px;font-size:20px;border-radius:22px}.clanhero h2{font-size:25px;margin:0 0 4px}.clanbody{font-size:14px;line-height:1.55;color:#d8dbe1}.traitgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.traitbox{background:var(--panel2);border:1px solid var(--line);border-radius:13px;padding:10px}.traitlabel{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:4px}.traitname{font-weight:800;margin-bottom:4px}.disciplines{display:flex;gap:7px;flex-wrap:wrap;margin:9px 0}.discipline{border:1px solid var(--line);background:var(--panel2);border-radius:999px;padding:6px 9px;font-size:12px;font-weight:700}.clanactions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
@media(max-width:650px){.grid2,.reviewgrid,.clangrid,.traitgrid{grid-template-columns:1fr}.focusbox{grid-template-columns:1fr}.resadd{grid-template-columns:1fr 1fr}.resadd .wide{grid-column:1/-1}.title{font-size:17px}.grid3{gap:5px}.card{padding:11px}.row{grid-template-columns:minmax(0,1fr) 118px}}
</style>

<body>
<div class="app">
  <div class="top">
    <div class="head"><div><div class="title">VTM V5 — Lifepath Chargen</div><div class="sub">V5 base · V6 Lifepaths / Skills / Resources · reactive validation</div></div><div class="badge">v0.2.0</div></div>
